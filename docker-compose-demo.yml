version: "3.9"

services:
  demo-init:
    image: alpine:3
    restart: "no"
    # The backend runs as the unprivileged user "app" (uid 1654), docker creates bind mounts as root.
    command: >
      sh -c '
        mkdir -p /data/postgres /data/receipts /data/logs &&
        chown -R 1654:1654 /data/receipts /data/logs'
    volumes:
      - ${DEMO_DATA_PATH:-./demo-data}:/data
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DEMO_DATA_PATH:-./demo-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    depends_on:
      demo-init:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:v1.27
    restart: always
    environment:
      # Served below /mail/ by the proxy (see nginx.conf).
      MP_WEBROOT: /mail/
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: ghcr.io/uni-verein/univerein-backend:${VERSION:?Set VERSION in .env}
    restart: always
    environment:
      ConnectionStrings__Default: Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      ConnectionStrings__Database: ${DB_NAME}
      ConnectionStrings__DbUser: ${DB_USER}
      ConnectionStrings__DbPassword: ${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      CRYPTO_KEY: ${CRYPTO_KEY}
      HMAC_KEY: ${HMAC_KEY}
      Version: ${VERSION}
      Demo__Enabled: "true"
    volumes:
      - ${DEMO_DATA_PATH:-./demo-data}/logs:/app/logs
      - ${DEMO_DATA_PATH:-./demo-data}/receipts:/app/receipts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      demo-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: ghcr.io/uni-verein/univerein-frontend:${VERSION}
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Addresses of a reverse proxy in front of this stack, see README (option B).
      - ./trusted-proxies:/etc/nginx/trusted-proxies:ro
    ports:
      - "80:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
