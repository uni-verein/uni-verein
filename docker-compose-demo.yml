version: "3.9"

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  db-restore:
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    command: >
      sh -c '
        echo "=== Initial restore on startup ==="
        psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -v ON_ERROR_STOP=1 < /dump/uni_verein_db.sql
        if [ $$? -ne 0 ]; then
          echo "ERROR: Initial restore failed!"
        else
          echo "Initial restore completed successfully"
        fi

        echo "=== Waiting for next restore at 03:00 ==="
        while true; do
          CURRENT_TIME=$$(date +%H:%M)
          if [ "$$CURRENT_TIME" = "03:00" ]; then
            echo "=== Nightly restore started ==="
            psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -v ON_ERROR_STOP=1 < /dump/uni_verein_db.sql
            if [ $$? -ne 0 ]; then
              echo "ERROR: Nightly restore failed!"
            else
              echo "Nightly restore completed successfully"
            fi
            sleep 60
          fi
          sleep 30
        done'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/demo-dump:/dump
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ConnectionStrings__Default: Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      ConnectionStrings__Database: ${DB_NAME}
      ConnectionStrings__DbUser: ${DB_USER}
      ConnectionStrings__DbPassword: ${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      CRYPTO_KEY: ${CRYPTO_KEY}
      HMAC_KEY: ${HMAC_KEY}
      Version: ${VERSION}
    volumes:
      - ./logs:/app/logs
      - ./receipts:/app/receipts
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_VERSION=${VERSION}
        - VITE_APP_DEMO=true
    restart: always
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginxinc/nginx-unprivileged:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db_data_pg:
