version: 2

# All ecosystems are bundled into a single weekly PR. Dependabot does NOT label it:
# 'ready-for-ci' is the maintainer's approval to run the pipeline, which installs
# the dependencies (npm ci, dotnet restore) next to the application secrets, so a
# maintainer adds it after looking at the bump. `labels: []` also switches off
# Dependabot's default 'dependencies' label; any label would start an extra
# `pull_request: labeled` run whose gate fails.
# New versions are only proposed after a cooldown, so a freshly published (and
# possibly malicious) release is not picked up right away. Security updates ignore
# the cooldown.
# Major updates are ignored so the bundled PR stays mergeable; they are done
# manually.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    labels: []

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    labels: []
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directory: "/backend"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    labels: []
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/backend"
      - "/backend/UniVerein.DbMigrator"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    labels: []
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    labels: []
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
