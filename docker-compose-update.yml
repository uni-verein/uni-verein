name: uni-verein-updater
services:
  update:
    image: docker:27-cli
    working_dir: ${PWD}
    stdin_open: true
    tty: true
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REPO: uni-verein/uni-verein
    entrypoint: >
      sh -c "
        set -e;
        apk add --no-cache curl jq docker-cli-compose >/dev/null;

        ENV_FILE=./.env;
        if [ ! -f \"$$ENV_FILE\" ]; then
          echo '[UPDATE] ERROR: No .env found in '\"$$(pwd)\"'. Run this from your installation directory.';
          exit 1;
        fi;

        CURRENT=$$(grep '^VERSION=' $$ENV_FILE 2>/dev/null | cut -d'=' -f2-);

        COMPOSE_FILE=docker-compose-prod-image.yml;
        if [ -f docker-compose-tls.yml ]; then
          COMPOSE_FILE=docker-compose-tls.yml;
        fi;

        if [ -f \"$$COMPOSE_FILE\" ] && grep -q 'image: *mariadb' \"$$COMPOSE_FILE\"; then
          echo '[UPDATE] ERROR: This installation is still on MariaDB. Follow legacy-update/README.md first:';
          echo '[UPDATE]   https://github.com/uni-verein/uni-verein/blob/main/legacy-update/README.md';
          exit 1;
        fi;

        echo '[UPDATE] Checking latest release on GitHub...';
        TAG=$$(curl -fsSL -H 'User-Agent: uni-verein-updater' https://api.github.com/repos/$$REPO/releases/latest | jq -r '.tag_name');
        if [ -z \"$$TAG\" ] || [ \"$$TAG\" = 'null' ]; then
          echo '[UPDATE] ERROR: Could not determine the latest release from GitHub.';
          exit 1;
        fi;

        echo \"[UPDATE] Installed version: $${CURRENT:-unknown} -> Target version: $$TAG\";

        if [ \"$$CURRENT\" = \"$$TAG\" ]; then
          echo '[UPDATE] Already up to date. Nothing to do.';
          exit 0;
        fi;

        echo '';
        echo \"[UPDATE] A new version ($$TAG) is available.\";
        echo '[UPDATE] Before continuing, please create a manual backup: database backup AND member export (Settings -> Backup in the app).';
        printf '[UPDATE] Have you completed a manual backup? Type yes to continue, anything else aborts: ';
        read CONFIRM;
        case \"$$CONFIRM\" in
          y|Y|yes|Yes|YES) ;;
          *)
            echo '[UPDATE] Aborted. Please create a backup first, then re-run this file.';
            exit 1;
            ;;
        esac;

        RAW_BASE=https://raw.githubusercontent.com/$$REPO/refs/tags/$$TAG;

        echo \"[UPDATE] Downloading docker-compose-ini.yml, nginx.conf and $$COMPOSE_FILE for $$TAG...\";
        curl -fsSL -o docker-compose-ini.yml $$RAW_BASE/docker-compose-ini.yml;
        curl -fsSL -o nginx.conf $$RAW_BASE/nginx.conf;
        curl -fsSL -o \"$$COMPOSE_FILE.new\" \"$$RAW_BASE/$$COMPOSE_FILE\";
        if [ \"$$COMPOSE_FILE\" = docker-compose-tls.yml ]; then
          echo '[UPDATE] Downloading Caddyfile...';
          curl -fsSL -o Caddyfile $$RAW_BASE/Caddyfile;
        fi;

        echo '[UPDATE] Applying new variables to .env (existing values are kept)...';
        docker compose -f docker-compose-ini.yml up;

        mv \"$$COMPOSE_FILE.new\" \"$$COMPOSE_FILE\";

        echo \"[UPDATE] Setting VERSION=$$TAG in .env...\";
        sed -i '/^VERSION=/d' $$ENV_FILE;
        echo \"VERSION=$$TAG\" >> $$ENV_FILE;

        echo '[UPDATE] Pulling new images...';
        docker compose -f \"$$COMPOSE_FILE\" pull;

        echo '[UPDATE] Restarting stack on the new version...';
        docker compose -f \"$$COMPOSE_FILE\" up -d --remove-orphans;

        if [ \"$$COMPOSE_FILE\" != docker-compose-tls.yml ] && ! ls trusted-proxies/*.conf >/dev/null 2>&1; then
          echo '';
          echo '[UPDATE] NOTE: No reverse proxy is listed in ./trusted-proxies. If you run your own reverse proxy in front of this stack (README, option B), all visitors share its address until you list it: one login lockout and one rate limit for everybody. Run:';
          echo '[UPDATE]   mkdir -p trusted-proxies && echo \"set_real_ip_from ADDRESS_OF_YOUR_PROXY;\" > trusted-proxies/proxy.conf';
          echo \"[UPDATE]   docker compose -f $$COMPOSE_FILE restart proxy\";
          echo '[UPDATE] Without a reverse proxy in front of this stack, ignore this note.';
          echo '';
        fi;

        echo \"[UPDATE] Done. Now running version $$TAG.\";
      "
    restart: "no"
