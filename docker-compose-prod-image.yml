version: "3.9"
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-backup:
    image: postgres:17-alpine
    command: >
      sh -c 'while true; do
        BACKUP_FILE="/backup/$$(date +%Y-%m-%d_%H-%M-%S)_uni_verein_db.sql"
        echo "Creating backup: $$BACKUP_FILE"
        pg_dump -h db -U $$POSTGRES_USER --format=plain --no-owner $$POSTGRES_DB > $$BACKUP_FILE 2>/tmp/err.log
        if [ $$? -ne 0 ]; then
          echo "ERROR: Backup failed!"
          cat /tmp/err.log
          rm -f $$BACKUP_FILE
        else
          gzip $$BACKUP_FILE
          echo "Backup completed: $$BACKUP_FILE.gz"
        fi
        find /backup -type f -name "*.sql.gz" -mtime +30 -delete
        sleep 86400
      done'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ${BACKUP_PATH}:/backup
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ghcr.io/uni-verein/univerein-backend:${VERSION}
    restart: always
    environment:
      ConnectionStrings__Default: Host=db;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      ConnectionStrings__Database: ${DB_NAME}
      ConnectionStrings__DbUser: ${DB_USER}
      ConnectionStrings__DbPassword: ${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      CRYPTO_KEY: ${CRYPTO_KEY}
      HMAC_KEY: ${HMAC_KEY}
      Version: ${VERSION}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/uni-verein/univerein-frontend:${VERSION}
    environment:
      VITE_APP_VERSION: ${VERSION}
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  db_data_pg:
