pid /tmp/nginx.pid;

events {}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    # Recover the real client IP when an optional TLS terminator (e.g. Caddy,
    # see docker-compose-tls.yml) sits in front of this proxy, so rate
    # limiting and audit logging in the backend keep working correctly.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format no_query_string '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log no_query_string;

    server {
        listen 8080;
        client_max_body_size 100M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Backend
        location /api/ {
            proxy_pass http://backend:8095/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Full backup restore (ZIP incl. receipt files) can be large.
            location /api/backup/restore {
                client_max_body_size 10G;
                proxy_pass http://backend:8095/backup/restore;
            }
        }
        
        # SignalR-Hub (WebSocket)
       location /emailProgress {
                   proxy_pass http://backend:8095/emailProgress;
                   proxy_set_header Host $host;
                   proxy_set_header X-Real-IP $remote_addr;
       
                   proxy_http_version 1.1;
                   proxy_set_header Upgrade $http_upgrade;
                   proxy_set_header Connection "upgrade";
       
                   proxy_read_timeout 86400s;
                   proxy_send_timeout 86400s;
               }

        # Frontend
        location / {
            proxy_pass http://frontend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # The frontend's own nginx already sets these, hide its copies so
            # they aren't duplicated alongside the ones added above.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Content-Security-Policy;
        }
    }
}