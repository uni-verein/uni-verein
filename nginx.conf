pid /tmp/nginx.pid;

events {}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;

    # Recover the real client IP when a reverse proxy sits in front of this nginx,
    # so rate limiting, the login lockout and audit logging in the backend see the
    # visitor and not the proxy. X-Forwarded-For is only believed from the addresses
    # listed here, for any other peer it is ignored (a visitor could forge it).
    #
    # Caddy of docker-compose-tls.yml has this fixed address (network "edge" there).
    # No other container or visitor can have it.
    set_real_ip_from 172.31.250.2;
    # Your own reverse proxy in front (README, option B): put one
    # "set_real_ip_from <address of your proxy>;" line into a *.conf file in the
    # trusted-proxies folder next to the compose file. Updates leave that folder alone.
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # The personal calendar feed token is part of the path, keep it out of the access log.
    map $uri $loggable_uri {
        ~^(?<feed_prefix>/api/calendar/feed/)[^/]+(?<feed_suffix>\.ics)$ "${feed_prefix}<redacted>${feed_suffix}";
        default $uri;
    }

    log_format no_query_string '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $loggable_uri $server_protocol" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log no_query_string;

    server {
        listen 8080;
        client_max_body_size 100M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # Backend
        location /api/ {
            proxy_pass http://backend:8095/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Full backup restore (ZIP incl. receipt files) can be large.
            location /api/backup/restore {
                client_max_body_size 10G;
                proxy_pass http://backend:8095/backup/restore;
            }
        }
        
        # SignalR-Hub (WebSocket)
       location /emailProgress {
                   proxy_pass http://backend:8095/emailProgress;
                   proxy_set_header Host $host;
                   proxy_set_header X-Real-IP $remote_addr;
                   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
       
                   proxy_http_version 1.1;
                   proxy_set_header Upgrade $http_upgrade;
                   proxy_set_header Connection "upgrade";
       
                   proxy_read_timeout 86400s;
                   proxy_send_timeout 86400s;
               }

        # Without the slash the request would fall through to the frontend below. Relative redirect, the
        # absolute one would carry the internal port 8080.
        location = /mail {
            absolute_redirect off;
            return 301 /mail/;
        }

        # Fake inbox of the demo stack (docker-compose-demo.yml). The upstream is resolved per request, so
        # the other stacks, which have no "mailpit" service, still start and only answer 502 here.
        location /mail/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $mailpit_upstream mailpit:8025;
            proxy_pass http://$mailpit_upstream;
            proxy_set_header Host $host;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        }

        # Frontend
        location / {
            proxy_pass http://frontend:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # The frontend's own nginx already sets these, hide its copies so
            # they aren't duplicated alongside the ones added above.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Permissions-Policy;
            proxy_hide_header Content-Security-Policy;
        }
    }
}